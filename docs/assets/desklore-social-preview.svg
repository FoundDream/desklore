<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f7" />
      <stop offset="1" stop-color="#eeeeec" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(238 94) rotate(40) scale(370 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbe4ff" stop-opacity="0.72" />
      <stop offset="1" stop-color="#dbe4ff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#161923" flood-opacity="0.18" />
    </filter>
    <clipPath id="screenshot-clip">
      <rect x="504" y="84" width="728" height="472" rx="22" />
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <rect width="1280" height="640" fill="url(#glow)" />

  <image href="../../build/icon.png" x="72" y="72" width="104" height="104" />
  <text x="72" y="244" fill="#17181c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="720" letter-spacing="-2.1">DeskLore</text>
  <text x="72" y="312" fill="#17181c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="650" letter-spacing="-0.8">Computer history,</text>
  <text x="72" y="350" fill="#17181c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="650" letter-spacing="-0.8">not screen recording.</text>
  <text x="72" y="408" fill="#62646c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">Semantic events first.</text>
  <text x="72" y="437" fill="#62646c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">Local by default. Open source.</text>

  <g transform="translate(72 502)">
    <rect width="118" height="36" rx="18" fill="#ffffff" stroke="#d9dade" />
    <circle cx="20" cy="18" r="4" fill="#4b62a9" />
    <text x="34" y="23" fill="#3d3f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">macOS 14+</text>
    <rect x="128" width="126" height="36" rx="18" fill="#ffffff" stroke="#d9dade" />
    <circle cx="148" cy="18" r="4" fill="#d58b2b" />
    <text x="162" y="23" fill="#3d3f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Local-first</text>
  </g>

  <rect x="488" y="68" width="760" height="504" rx="30" fill="#ffffff" opacity="0.74" filter="url(#shadow)" />
  <image href="desklore-timeline.png" x="504" y="84" width="728" height="472" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenshot-clip)" />
  <rect x="504" y="84" width="728" height="472" rx="22" fill="none" stroke="#d8d9dd" />
</svg>
